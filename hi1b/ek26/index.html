<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia 1b EK26 – Planering</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #F7F4EE; color: #0F1B2D;
            font-family: 'Space Grotesk', sans-serif; -webkit-font-smoothing: antialiased;
        }
        a { color: #2355A0; text-decoration: none; }
        a:hover { color: #D4880A; text-decoration: underline; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .site-header {
            display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center;
            padding: 16px 24px; background: #FFFFFF; border-bottom: 1px solid #DDD8D0;
            position: sticky; top: 0; z-index: 20;
        }
        .site-header .title-group { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        .subject-link {
            font-family: 'Spectral', serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em;
            color: #0F1B2D; cursor: pointer; background: none; border: none; padding: 0; font: inherit;
        }
        .subject-link:hover { color: #D4880A; text-decoration: none; }
        .course-code {
            font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
            letter-spacing: 0.04em; color: #D4880A;
        }
        .meta-group { display: flex; align-items: center; gap: 12px; }
        .header-meta { font-size: 13px; color: #96A3B0; }
        .btn {
            font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: #556070;
            background: #FFFFFF; border: 1px solid #DDD8D0; border-radius: 4px; padding: 8px 14px;
            cursor: pointer; min-height: 36px; display: inline-flex; align-items: center;
            transition: border-color 150ms ease, color 150ms ease; text-decoration: none;
        }
        .btn:hover { border-color: #D4880A; color: #D4880A; text-decoration: none; }
        .menu-toggle { display: none; }

        .course-layout { display: flex; flex-wrap: wrap; align-items: flex-start; max-width: 1360px; margin: 0 auto; }

        .sidebar { flex: 1 1 260px; min-width: 250px; max-width: 320px; padding: 24px 16px 40px; position: sticky; top: 69px; }
        .sidebar .label {
            font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em;
            text-transform: uppercase; color: #96A3B0; margin: 0 0 12px; padding-left: 12px;
        }
        .moment-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
        .moment-item button {
            display: flex; gap: 11px; align-items: baseline; text-align: left; width: 100%;
            font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; line-height: 1.4;
            background: transparent; border: none; border-left: 3px solid transparent;
            border-radius: 0 6px 6px 0; padding: 12px; cursor: pointer; min-height: 44px;
            color: #556070; font-weight: 400; transition: background 150ms ease;
        }
        .moment-item button:hover { background: #EFEBE3; }
        .moment-item button.active { background: #F1EADC; border-left-color: #D4880A; color: #0F1B2D; font-weight: 600; }
        .moment-item .num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #96A3B0; }
        .moment-item button.active .num { color: #D4880A; }
        .sidebar .stats {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.6; color: #96A3B0;
            margin: 20px 0 0; padding: 14px 12px 0; border-top: 1px solid #DDD8D0;
        }

        .content { flex: 999 1 540px; min-width: 300px; padding: 28px 24px 96px; animation: fadeIn 200ms ease-out; }
        .loading-row { display: flex; align-items: center; gap: 14px; padding: 24px 0; color: #96A3B0; font-size: 15px; }
        .spinner {
            width: 22px; height: 22px; border: 3px solid #DDD8D0; border-top-color: #D4880A;
            border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; flex-shrink: 0;
        }
        .error-card {
            background: #FFFFFF; border: 1px solid #DDD8D0; border-left: 3px solid #B52020;
            border-radius: 0 8px 8px 0; padding: 16px 20px; margin-bottom: 24px;
        }
        .error-card p { font-size: 14px; line-height: 1.6; color: #556070; margin: 0; }

        .view { display: none; }
        .view.active { display: block; }
        .kicker {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em;
            text-transform: uppercase; color: #D4880A; margin: 0 0 10px;
        }
        .view h1 {
            font-family: 'Spectral', serif; font-size: 32px; line-height: 1.15; font-weight: 600;
            letter-spacing: -0.02em; margin: 0 0 14px;
        }
        .intro-text {
            font-size: 15.5px; line-height: 1.65; color: #556070; max-width: 64ch; margin: 0 0 8px;
            white-space: pre-line;
        }
        .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 24px; }
        .chip {
            font-family: 'JetBrains Mono', monospace; font-size: 12px; background: #FFFFFF;
            border: 1px solid #DDD8D0; border-radius: 4px; padding: 6px 10px; color: #556070;
        }
        .chip.chip-countdown {
            background: #FBF0DC; border-color: #EBD3A0; color: #96590A; font-weight: 700;
        }
        .exam-banner {
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; max-width: 720px;
            margin: 4px 0 8px; padding: 12px 16px; background: #FBF0DC; border: 1px solid #EBD3A0; border-radius: 8px;
        }
        .exam-banner .exam-label {
            font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
            text-transform: uppercase; color: #96590A;
        }
        .exam-banner .exam-when { font-size: 15px; font-weight: 600; color: #0F1B2D; }
        .exam-banner .exam-what { font-size: 14px; color: #556070; }
        .exam-banner .exam-count {
            margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #96590A;
        }
        .exam-banner.past { background: #FFFFFF; border-color: #DDD8D0; }
        .exam-banner.past .exam-label, .exam-banner.past .exam-count { color: #96A3B0; }

        .exam-overview { margin: 32px 0 0; max-width: 720px; }
        .exam-overview .label {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em;
            text-transform: uppercase; color: #D4880A; margin: 0 0 12px;
        }
        .exam-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
        .exam-item button {
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; width: 100%; text-align: left; min-height: 44px;
            font-family: 'Space Grotesk', sans-serif; color: #0F1B2D; cursor: pointer;
            background: #FFFFFF; border: 1px solid #DDD8D0; border-left: 3px solid #D4880A;
            border-radius: 0 8px 8px 0; padding: 12px 16px; transition: border-color 150ms ease;
        }
        .exam-item button:hover { border-color: #D4880A; }
        .exam-item .exam-week {
            flex: 0 0 48px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #D4880A;
        }
        .exam-item .exam-body { flex: 1 1 160px; min-width: 0; }
        .exam-item .exam-title { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; }
        .exam-item .exam-meta { display: block; font-size: 13px; line-height: 1.5; color: #556070; margin-top: 2px; }
        .exam-item .exam-count {
            flex: 0 0 auto; margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; white-space: nowrap;
            color: #96590A; background: #FBF0DC; border: 1px solid #EBD3A0; border-radius: 4px; padding: 4px 8px;
        }
        .exam-item.past button { border-left-color: #DDD8D0; opacity: 0.6; }
        .exam-item.past .exam-week { color: #96A3B0; }
        .exam-item.past .exam-count { color: #96A3B0; background: #F7F4EE; border-color: #DDD8D0; }

        .week-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
        .week-card {
            background: #FFFFFF; border: 1px solid #DDD8D0; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(15,27,45,0.06); overflow: hidden;
        }
        .week-card.prov { border-color: #EBD3A0; }
        .week-card .top { display: flex; flex-wrap: wrap; }
        .week-num-col { flex: 0 0 auto; width: 74px; padding: 16px 0 16px 18px; }
        .week-num-col .num { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; line-height: 1; color: #96A3B0; }
        .week-card.prov .week-num-col .num { color: #D4880A; }
        .week-num-col .kind {
            font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em;
            text-transform: uppercase; color: #96A3B0; margin: 4px 0 0;
        }
        .week-card.prov .week-num-col .kind { color: #D4880A; }
        .day-grid {
            flex: 1 1 300px; min-width: 200px; display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px;
            background: #EFEBE3; border-left: 1px solid #EFEBE3;
        }
        .day-cell { padding: 16px 18px; background: #FFFFFF; }
        .day-cell .day-label {
            font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em;
            text-transform: uppercase; color: #96A3B0; margin: 0 0 6px;
        }
        .day-cell .day-text { font-size: 14px; line-height: 1.6; color: #0F1B2D; margin: 0; white-space: pre-line; }
        .day-cell .day-text.empty { color: #96A3B0; }
        .day-cell .day-text.prov { font-weight: 600; }
        .moment-summary { margin: 0 0 24px; padding: 14px 18px; background: #FBF8F2; border: 1px solid #EFEBE3; border-radius: 8px; }
        .moment-summary .summary-label {
            font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em;
            text-transform: uppercase; color: #D4880A; margin: 0 0 6px; display: block;
        }
        .moment-summary p { font-size: 14px; line-height: 1.6; color: #556070; margin: 0; white-space: pre-line; }
        .day-hw { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #EFEBE3; }
        .day-hw .hw-label {
            font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em;
            text-transform: uppercase; color: #D4880A; flex: 0 0 auto; padding-top: 2px;
        }
        .day-hw p { font-size: 13px; line-height: 1.55; color: #556070; margin: 0; white-space: pre-line; }
        .footnote { font-size: 12.5px; line-height: 1.6; color: #96A3B0; margin: 28px 0 0; max-width: 60ch; }

        @media (max-width: 768px) {
            .course-layout { flex-direction: column; }
            .menu-toggle { display: inline-flex; }
            .sidebar {
                position: static; width: 100%; max-width: none; padding: 0 16px;
                max-height: 0; overflow: hidden; transition: max-height 200ms ease;
            }
            .sidebar.open { max-height: 2000px; padding: 16px; }
            .content { padding: 24px 16px 64px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="title-group">
            <button type="button" class="subject-link" onclick="goWelcome()">Historia 1b</button>
            <span class="course-code">EK26</span>
        </div>
        <div class="meta-group">
            <span class="header-meta">Tisdag · Onsdag</span>
            <button type="button" class="btn menu-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰ Meny</button>
        </div>
    </header>

    <div class="course-layout">
        <nav class="sidebar">
            <p class="label">Moment</p>
            <ul class="moment-list" id="menu"></ul>
            <p class="stats" id="stats"></p>
        </nav>

        <main class="content">
            <div id="load-status" class="loading-row">
                <span class="spinner"></span>
                <span>Hämtar planering…</span>
            </div>

            <div id="welcome" class="view active">
                <p class="kicker">Läsåret 2025/26</p>
                <h1>Välkommen!</h1>
                <p class="intro-text" id="welcome-text">Det här är planeringen för terminens moment i Historia 1b. Klicka på ett moment i menyn för att se veckoplanering, sidor och uppgifter.</p>
                <div id="exam-overview"></div>
            </div>

            <div id="sections"></div>
        </main>
    </div>

    <script>
        const SHEET_ID = '1JJ5CstuMvuselACdf_MGavxjOblIJYLfzoDAOF5jn2Y';
        const GID = '1800788346';
        const JSONP_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleData&gid=${GID}&headers=1&_=${Date.now()}`;
        const TIMEOUT_MS = 10000;
        const UNIT_LABEL = 'Moment';
        const DAY1_LABEL = 'Tisdag';
        const DAY2_LABEL = 'Onsdag';

        let data = [];
        let momentSummaries = {};
        let momentExamDates = {};
        let timeoutId = null;

        function handleData(response) {
            clearTimeout(timeoutId);
            hideLoadStatus();

            try {
                const table = response.table;
                if (!table || !table.rows || table.rows.length < 1) {
                    showError('Kalkylbladet verkar tomt eller saknar rader.');
                    return;
                }

                data = [];
                momentSummaries = {};
                momentExamDates = {};
                let introText = null;
                const rows = table.rows;
                for (let i = 0; i < rows.length; i++) {
                    const cells = rows[i].c;
                    if (!cells) continue;
                    let moment = cells[0]?.v?.toString().trim() || '';
                    const vecka = cells[1]?.v?.toString().trim() || '';
                    const dag1  = cells[2]?.v?.toString().trim() || '';
                    const laxa1 = cells[3]?.v?.toString().trim() || '';
                    const dag2  = cells[4]?.v?.toString().trim() || '';
                    const laxa2 = cells[5]?.v?.toString().trim() || '';
                    if (!moment && !vecka) {
                        // Google Sheets nollar textceller (t.ex. "Info") i kolumner
                        // den tolkat som numeriska. En rad helt utan Moment och Vecka
                        // men med text i sista kolumnen (läxa dag 2) räknas därför som
                        // välkomstraden – till skillnad från en vanlig vecka utan
                        // tema, som alltid har ett veckonummer.
                        if (laxa2) introText = laxa2;
                        continue;
                    }
                    if (moment.toLowerCase() === 'info') {
                        introText = laxa2;
                        continue;
                    }
                    if (moment.toLowerCase() === 'omprov') continue;
                    if (moment && !vecka) {
                        // En rad med Moment ifyllt men utan veckonummer är en
                        // sammanfattning för hela momentet (t.ex. "sidor att
                        // kunna till provet"), inte en egen vecka. Läxa (dag 1)
                        // kan också innehålla provdatumet (ÅÅÅÅ-MM-DD) för en
                        // nedräkning högst upp i momentets vy.
                        if (laxa2) momentSummaries[moment] = laxa2;
                        if (laxa1) momentExamDates[moment] = laxa1;
                        continue;
                    }
                    if (!moment) moment = vecka;
                    data.push({
                        moment,
                        vecka,
                        dag1,
                        laxa1,
                        dag2,
                        laxa2
                    });
                }

                if (introText) applyWelcomeText(introText);
                buildMenu();
                buildSections();
                buildExamOverview();

            } catch (error) {
                console.error('Fel vid tolkning av data:', error);
                showError('Det gick inte att tolka data från kalkylbladet.');
            }
        }

        function applyWelcomeText(text) {
            document.getElementById('welcome-text').textContent = text;
        }

        function hideLoadStatus() {
            const el = document.getElementById('load-status');
            if (el) el.remove();
        }

        function showError(msg) {
            hideLoadStatus();
            const welcome = document.getElementById('welcome');
            if (!welcome) return;
            const div = document.createElement('div');
            div.className = 'error-card';
            const p = document.createElement('p');
            p.textContent = 'Fel: ' + msg;
            div.appendChild(p);
            welcome.appendChild(div);
        }

        function leadNum(name) {
            const m = /^\s*(\d+)\s*[.)\-–:]?\s+/.exec(name);
            return m ? m[1] : null;
        }
        function stripNum(name) {
            const stripped = name.replace(/^\s*\d+\s*[.)\-–:]?\s+/, '').trim();
            return stripped || name.trim();
        }
        function isProv(text) {
            return /prov/i.test(text || '');
        }
        function isPureNumber(str) {
            return /^\d+$/.test(str.trim());
        }
        function parseSheetDate(str) {
            if (!str) return null;
            const m = str.match(/^Date\((\d+),(\d+),(\d+)\)$/);
            if (m) return new Date(parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10));
            const d = new Date(str);
            return isNaN(d.getTime()) ? null : d;
        }
        function startOfToday() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return today;
        }
        function countdownText(examDate) {
            if (!examDate) return null;
            const diffDays = Math.round((examDate - startOfToday()) / 86400000);
            if (diffDays > 1) return diffDays + ' dagar till provet';
            if (diffDays === 1) return '1 dag till provet';
            if (diffDays === 0) return 'Prov idag!';
            return 'Genomfört';
        }
        const WEEKDAYS = ['måndag', 'tisdag', 'onsdag', 'torsdag', 'fredag', 'lördag', 'söndag'];
        function dayName(label) {
            return (label || '').trim().split(/\s+/)[0].toLowerCase();
        }
        function isoWeek(date) {
            // Torsdagen i samma vecka avgör vilket år veckan hör till (ISO 8601).
            const thu = new Date(date.getFullYear(), date.getMonth(), date.getDate() + 3 - ((date.getDay() + 6) % 7));
            const jan1 = new Date(thu.getFullYear(), 0, 1);
            return 1 + Math.floor(Math.round((thu - jan1) / 86400000) / 7);
        }
        function dateFromWeek(vecka, dayLabel) {
            // Räknar ut datumet för en viss veckodag i en viss vecka. Arket anger
            // inget år, så det år väljs som ger datumet närmast idag – det
            // fungerar för en planering som sträcker sig högst ett halvår bakåt
            // eller framåt.
            const week = parseInt(vecka, 10);
            const dayIdx = WEEKDAYS.indexOf(dayName(dayLabel));
            if (isNaN(week) || week < 1 || week > 53 || dayIdx < 0) return null;
            const today = startOfToday();
            let best = null;
            [-1, 0, 1].forEach(offset => {
                const year = today.getFullYear() + offset;
                const jan4 = new Date(year, 0, 4);
                const d = new Date(year, 0, 4 - ((jan4.getDay() + 6) % 7) + (week - 1) * 7 + dayIdx);
                if (isoWeek(d) !== week) return;
                if (!best || Math.abs(d - today) < Math.abs(best - today)) best = d;
            });
            return best;
        }
        function formatDate(date) {
            return date.toLocaleDateString('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        function momentLabel(name) {
            return (UNIT_LABEL === 'Vecka' || isPureNumber(name)) ? 'Vecka ' + name : stripNum(name);
        }
        function getMomentNames() {
            const names = [];
            data.forEach(row => { if (!names.includes(row.moment)) names.push(row.moment); });
            return names;
        }
        function collectExams(name) {
            // Prov hittas på två sätt: dagceller som innehåller ordet "prov"
            // (samma regel som markerar provveckor i korten) och ett provdatum
            // från momentets sammanfattningsrad. Ett datum i arket går före det
            // som räknas ut från veckonummer + veckodag.
            const exams = [];
            data.filter(r => r.moment === name).forEach(r => {
                [[DAY1_LABEL, r.dag1], [DAY2_LABEL, r.dag2]].forEach(([label, text]) => {
                    if (isProv(text)) exams.push({ moment: name, vecka: r.vecka, day: dayName(label), text, date: dateFromWeek(r.vecka, label) });
                });
            });
            const explicit = parseSheetDate(momentExamDates[name]);
            if (explicit) {
                explicit.setHours(0, 0, 0, 0);
                const week = String(isoWeek(explicit));
                const match = exams.length === 1 ? exams[0] : exams.find(e => e.vecka === week);
                if (match) match.date = explicit;
                else exams.push({ moment: name, vecka: week, day: null, text: '', date: explicit });
            }
            return exams;
        }
        function examWhen(exam) {
            if (exam.date) return formatDate(exam.date) + (exam.vecka ? ' · v.' + exam.vecka : '');
            return (exam.day ? exam.day + ' ' : '') + 'vecka ' + exam.vecka;
        }
        function examWhat(exam) {
            const text = (exam.text || '').trim();
            return text && text.toLowerCase() !== 'prov' ? text : '';
        }
        function isPast(exam) {
            return !!exam.date && exam.date < startOfToday();
        }
        function slugify(str) {
            return str.toLowerCase().replace(/[^a-z0-9åäö]+/g, '-').replace(/^-+|-+$/g, '') || 'x';
        }

        function buildMenu() {
            const menu = document.getElementById('menu');
            if (!menu) return;
            menu.innerHTML = '';

            const momentNames = [];
            data.forEach(row => { if (!momentNames.includes(row.moment)) momentNames.push(row.moment); });

            momentNames.forEach((name, i) => {
                const li = document.createElement('li');
                li.className = 'moment-item';
                const btn = document.createElement('button');
                btn.type = 'button';
                const slug = slugify(name) + '-' + i;
                btn.dataset.section = slug;

                const numSpan = document.createElement('span');
                numSpan.className = 'num';
                const titleSpan = document.createElement('span');

                if (UNIT_LABEL === 'Vecka' || isPureNumber(name)) {
                    numSpan.textContent = String(i + 1).padStart(2, '0');
                    numSpan.style.visibility = 'hidden';
                    titleSpan.textContent = 'Vecka ' + name;
                } else {
                    const own = leadNum(name);
                    numSpan.textContent = (own != null ? own : String(i + 1)).padStart(2, '0');
                    titleSpan.textContent = stripNum(name);
                }

                btn.appendChild(numSpan);
                btn.appendChild(titleSpan);
                btn.addEventListener('click', () => {
                    showSection(slug);
                    setActiveNav(btn);
                });
                li.appendChild(btn);
                menu.appendChild(li);
            });

            const weekCount = new Set(data.map(r => r.vecka).filter(v => v)).size;
            const stats = document.getElementById('stats');
            if (stats) {
                stats.textContent = momentNames.length + (momentNames.length === 1 ? ' ' + (UNIT_LABEL === 'Vecka' ? 'vecka' : 'moment') : ' ' + (UNIT_LABEL === 'Vecka' ? 'veckor' : 'moment'))
                    + (UNIT_LABEL === 'Vecka' ? '' : ' · ' + weekCount + (weekCount === 1 ? ' vecka' : ' veckor'));
            }
        }

        function buildSections() {
            const container = document.getElementById('sections');
            if (!container) return;
            container.innerHTML = '';

            const momentNames = [];
            data.forEach(row => { if (!momentNames.includes(row.moment)) momentNames.push(row.moment); });

            momentNames.forEach((name, i) => {
                const rows = data.filter(row => row.moment === name);
                const slug = slugify(name) + '-' + i;

                const view = document.createElement('div');
                view.className = 'view';
                view.id = slug;

                const kicker = document.createElement('p');
                kicker.className = 'kicker';
                const h1 = document.createElement('h1');

                if (UNIT_LABEL === 'Vecka' || isPureNumber(name)) {
                    kicker.textContent = 'Vecka';
                    h1.textContent = 'Vecka ' + name;
                } else {
                    const own = leadNum(name);
                    kicker.textContent = own != null ? ('Moment ' + own) : ('Moment ' + (i + 1) + ' av ' + momentNames.length);
                    h1.textContent = stripNum(name);
                }
                view.appendChild(kicker);
                view.appendChild(h1);

                collectExams(name).forEach(exam => {
                    const banner = document.createElement('div');
                    banner.className = 'exam-banner' + (isPast(exam) ? ' past' : '');
                    const label = document.createElement('span');
                    label.className = 'exam-label';
                    label.textContent = 'Prov';
                    const when = document.createElement('span');
                    when.className = 'exam-when';
                    when.textContent = examWhen(exam);
                    banner.appendChild(label);
                    banner.appendChild(when);
                    if (examWhat(exam)) {
                        const what = document.createElement('span');
                        what.className = 'exam-what';
                        what.textContent = examWhat(exam);
                        banner.appendChild(what);
                    }
                    if (exam.date) {
                        const count = document.createElement('span');
                        count.className = 'exam-count';
                        count.textContent = countdownText(exam.date);
                        banner.appendChild(count);
                    }
                    view.appendChild(banner);
                });

                if (UNIT_LABEL === 'Moment' && !isPureNumber(name)) {
                    const nums = rows.map(r => parseInt(r.vecka, 10)).filter(n => !isNaN(n));
                    if (nums.length) {
                        const chipRow = document.createElement('div');
                        chipRow.className = 'chip-row';
                        const span1 = document.createElement('span');
                        span1.className = 'chip';
                        span1.textContent = 'v.' + Math.min.apply(null, nums) + '–' + Math.max.apply(null, nums);
                        const span2 = document.createElement('span');
                        span2.className = 'chip';
                        span2.textContent = rows.length + (rows.length === 1 ? ' vecka' : ' veckor');
                        chipRow.appendChild(span1);
                        chipRow.appendChild(span2);
                        view.appendChild(chipRow);
                    }
                }

                if (momentSummaries[name]) {
                    const summary = document.createElement('div');
                    summary.className = 'moment-summary';
                    const summaryLabel = document.createElement('span');
                    summaryLabel.className = 'summary-label';
                    summaryLabel.textContent = 'Sammanfattning';
                    const summaryText = document.createElement('p');
                    summaryText.textContent = momentSummaries[name];
                    summary.appendChild(summaryLabel);
                    summary.appendChild(summaryText);
                    view.appendChild(summary);
                }

                const list = document.createElement('ul');
                list.className = 'week-list';
                list.style.marginTop = (UNIT_LABEL === 'Moment' && !isPureNumber(name)) ? '0' : '24px';

                rows.forEach(row => {
                    // En vecka som delas mellan två moment (se README) skrivs som två
                    // rader med samma veckonummer. Den halva som saknar allt innehåll
                    // är bara en gränsmarkering för momentbytet och ska inte visas som
                    // ett eget, tomt veckokort – den riktiga informationen finns redan
                    // på den andra radens kort.
                    const isBoundaryOnly = !row.dag1 && !row.dag2 && !row.laxa1 && !row.laxa2 &&
                        data.some(r => r.vecka === row.vecka && r.moment !== row.moment);
                    if (isBoundaryOnly) return;

                    const prov = isProv(row.dag1) || isProv(row.dag2);
                    const li = document.createElement('li');
                    const card = document.createElement('article');
                    card.className = 'week-card' + (prov ? ' prov' : '');

                    const top = document.createElement('div');
                    top.className = 'top';

                    const numCol = document.createElement('div');
                    numCol.className = 'week-num-col';
                    const numEl = document.createElement('span');
                    numEl.className = 'num';
                    numEl.textContent = row.vecka || '–';
                    const kindEl = document.createElement('p');
                    kindEl.className = 'kind';
                    kindEl.textContent = prov ? 'Prov' : 'Vecka';
                    numCol.appendChild(numEl);
                    numCol.appendChild(kindEl);

                    const dayGrid = document.createElement('div');
                    dayGrid.className = 'day-grid';
                    [[DAY1_LABEL, row.dag1, row.laxa1], [DAY2_LABEL, row.dag2, row.laxa2]].forEach(([label, text, laxa]) => {
                        const cell = document.createElement('div');
                        cell.className = 'day-cell';
                        const labelEl = document.createElement('p');
                        labelEl.className = 'day-label';
                        labelEl.textContent = label;
                        const textEl = document.createElement('p');
                        const hasText = !!text;
                        textEl.className = 'day-text' + (!hasText ? ' empty' : '') + (hasText && isProv(text) ? ' prov' : '');
                        textEl.textContent = hasText ? text : '—';
                        cell.appendChild(labelEl);
                        cell.appendChild(textEl);
                        if (laxa) {
                            const hw = document.createElement('div');
                            hw.className = 'day-hw';
                            const hwLabel = document.createElement('span');
                            hwLabel.className = 'hw-label';
                            hwLabel.textContent = 'Läxa';
                            const hwText = document.createElement('p');
                            hwText.textContent = laxa;
                            hw.appendChild(hwLabel);
                            hw.appendChild(hwText);
                            cell.appendChild(hw);
                        }
                        dayGrid.appendChild(cell);
                    });

                    top.appendChild(numCol);
                    top.appendChild(dayGrid);
                    card.appendChild(top);

                    li.appendChild(card);
                    list.appendChild(li);
                });

                view.appendChild(list);

                const footnote = document.createElement('p');
                footnote.className = 'footnote';
                footnote.textContent = 'Planeringen kan ändras vid sjukdom eller liknande — provdatum ligger fast.';
                view.appendChild(footnote);

                container.appendChild(view);
            });
        }

        function buildExamOverview() {
            const container = document.getElementById('exam-overview');
            if (!container) return;
            container.innerHTML = '';

            const momentNames = getMomentNames();
            const exams = [];
            momentNames.forEach((name, i) => {
                collectExams(name).forEach(exam => exams.push(Object.assign({ slug: slugify(name) + '-' + i }, exam)));
            });
            if (!exams.length) return;

            const wrap = document.createElement('section');
            wrap.className = 'exam-overview';
            const label = document.createElement('p');
            label.className = 'label';
            label.textContent = 'Prov i planeringen';
            const list = document.createElement('ul');
            list.className = 'exam-list';

            exams.forEach(exam => {
                const li = document.createElement('li');
                li.className = 'exam-item' + (isPast(exam) ? ' past' : '');
                const btn = document.createElement('button');
                btn.type = 'button';

                const week = document.createElement('span');
                week.className = 'exam-week';
                week.textContent = exam.vecka ? 'v.' + exam.vecka : '–';
                const body = document.createElement('span');
                body.className = 'exam-body';
                const title = document.createElement('span');
                title.className = 'exam-title';
                title.textContent = momentLabel(exam.moment);
                const meta = document.createElement('span');
                meta.className = 'exam-meta';
                const when = exam.date ? formatDate(exam.date) : (exam.day || '');
                meta.textContent = [when, examWhat(exam)].filter(Boolean).join(' · ');
                body.appendChild(title);
                if (meta.textContent) body.appendChild(meta);

                btn.appendChild(week);
                btn.appendChild(body);
                if (exam.date) {
                    const count = document.createElement('span');
                    count.className = 'exam-count';
                    count.textContent = countdownText(exam.date);
                    btn.appendChild(count);
                }
                btn.addEventListener('click', () => {
                    showSection(exam.slug);
                    setActiveNav(document.querySelector('.moment-item button[data-section="' + exam.slug + '"]'));
                    window.scrollTo(0, 0);
                });
                li.appendChild(btn);
                list.appendChild(li);
            });

            wrap.appendChild(label);
            wrap.appendChild(list);
            container.appendChild(wrap);
        }

        function showSection(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const target = document.getElementById(id);
            if (target) target.classList.add('active');
            if (window.innerWidth <= 768) document.querySelector('.sidebar').classList.remove('open');
        }

        function setActiveNav(link) {
            document.querySelectorAll('.moment-item button').forEach(b => b.classList.remove('active'));
            if (link) link.classList.add('active');
        }

        function goWelcome() {
            showSection('welcome');
            setActiveNav(null);
        }

        timeoutId = setTimeout(() => {
            showError('Kalkylbladet svarar inte. Kontrollera att det är publikt och att Sheet-ID är korrekt.');
        }, TIMEOUT_MS);

        const script = document.createElement('script');
        script.src = JSONP_URL;
        script.onerror = () => {
            clearTimeout(timeoutId);
            showError('Kunde inte ansluta till Google Sheets. Kontrollera Sheet-ID och att kalkylbladet är publikt.');
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
