<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Från jordbrukssamhälle till industrisamhälle – material att skriva ut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ---------- Grund ---------- */
@page { size: A4 portrait; margin: 11mm 12mm; }
:root{
  --ink:#1f2328; --mut:#625c52; --rule:#d9d3c7; --acc:#7a3b2e; --tint:#f6f2ea;
  --A:#cfe0f5; --B:#f8dcc0; --C:#d4ebd0; --D:#e4d6ef; --V:#e9e4da; --M:#efe9c9;
}
*{box-sizing:border-box}
body{margin:0;background:#e9e5dd;color:var(--ink);font-family:Inter,"Helvetica Neue",Arial,sans-serif;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.serif{font-family:Lora,Georgia,"DejaVu Serif",serif}

/* ---------- Verktygsrad (syns bara på skärmen) ---------- */
.toolbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--rule);
  padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px}
.toolbar h1{font-family:Lora,Georgia,serif;font-size:18px;margin:0 12px 0 0}
.toolbar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.toolbar button{font:600 14px Inter,sans-serif;background:var(--acc);color:#fff;border:0;border-radius:5px;
  padding:9px 16px;cursor:pointer}
.toolbar .hint{color:var(--mut);font-size:12.5px;flex-basis:100%}
.toolbar a{color:var(--acc)}

/* ---------- Ark ---------- */
.sheet{width:210mm;min-height:297mm;margin:10mm auto;background:#fff;padding:11mm 12mm;
  box-shadow:0 2px 10px rgba(0,0,0,.12);position:relative;page-break-after:always;break-after:page}
.sheet.hidden{display:none}
.kicker{font-size:8pt;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
h2.title{font-family:Lora,Georgia,serif;font-size:20pt;margin:1mm 0 4mm;line-height:1.1}
h3{font-family:Lora,Georgia,serif;font-size:12pt;margin:4mm 0 1.5mm}
p,li{font-size:10pt;line-height:1.45}
.small{font-size:8.5pt;color:var(--mut)}
.cutnote{font-size:8pt;color:var(--mut);margin:0 0 2mm}
.box{background:var(--tint);border-left:3px solid var(--acc);padding:3mm 4mm;margin:2mm 0}

@media print{
  body{background:#fff}
  .toolbar{display:none}
  .sheet{margin:0;box-shadow:none;width:auto;min-height:0;padding:0}
  #out > div:last-child > .sheet:last-child{page-break-after:auto;break-after:auto}
}

/* ---------- Lärarblad ---------- */
.plan{width:100%;border-collapse:collapse;margin:1mm 0 3mm}
.plan td,.plan th{border-bottom:.6pt solid var(--rule);text-align:left;vertical-align:top;padding:1.6mm 2mm;font-size:9.4pt;line-height:1.4}
.plan th{font-size:7.5pt;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);border-bottom:1.2pt solid var(--ink)}
.plan td.t{white-space:nowrap;font-weight:700;width:16mm}
.plan td.n{font-weight:700;width:44mm}
.twocol{columns:2;column-gap:7mm}
.twocol > *{break-inside:avoid}
ol.tight,ul.tight{margin:1mm 0 2mm;padding-left:5mm}
ol.tight li,ul.tight li{font-size:9.4pt;margin:.6mm 0}

/* ---------- Rollkort ---------- */
.role{height:134mm;border:1px dashed #9a9387;padding:5mm 6mm;display:flex;flex-direction:column;position:relative}
.role + .role{margin-top:4mm}
.role .band{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:2mm;margin-bottom:2.5mm}
.role .name{font-family:Lora,Georgia,serif;font-size:21pt;font-weight:700;line-height:1}
.role .what{font-size:10pt;font-weight:700;color:var(--acc);margin-top:1mm}
.role .where{font-size:9pt;color:var(--mut);text-align:right}
.role .badge{display:inline-block;font-size:7.5pt;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  background:var(--ink);color:#fff;padding:1mm 2mm;border-radius:2mm;margin-bottom:1mm}
.role .story{font-size:10.3pt;line-height:1.45;margin:0 0 2.5mm}
.role .qs{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm;flex:1}
.role .q{border:1px solid var(--rule);border-radius:2mm;padding:2mm 2.5mm;display:flex;flex-direction:column}
.role .q b{font-size:8pt;text-transform:uppercase;letter-spacing:.06em}
.role .q span{font-size:8.6pt;color:var(--mut);line-height:1.3}
.role .q .lines{flex:1;margin-top:1.5mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 6.4mm,#cfc8bb 6.4mm,#cfc8bb 6.7mm)}
.scissor{position:absolute;top:-3.2mm;left:4mm;font-size:9pt;color:#9a9387;background:#fff;padding:0 1mm}

/* ---------- Skiftesspelet ---------- */
.grids{display:flex;gap:6mm;justify-content:space-between;margin:2mm 0 3mm}
.gridwrap{flex:1}
.gridwrap h3{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(8,11mm);grid-auto-rows:11mm;border:1.2pt solid var(--ink);width:max-content}
.cell{border:.5pt solid #8d877c;display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-weight:800;font-size:10pt;line-height:1;position:relative}
.cell small{font-size:8pt;font-weight:700;margin-top:.6mm}
.cell.A{background:var(--A)} .cell.B{background:var(--B)} .cell.C{background:var(--C)} .cell.D{background:var(--D)}
.cell.V{background:#fff;font-size:7pt;font-weight:700;text-align:center}
.cell.M{background:var(--M);font-size:6.5pt;font-weight:700}
.cell.E{background:#fff}
.cell.E.M{background:var(--M)}
.legend{display:flex;flex-wrap:wrap;gap:2mm 5mm;font-size:8.6pt;margin:1mm 0 2mm}
.legend i{display:inline-block;width:4mm;height:4mm;border:.5pt solid #8d877c;vertical-align:-0.7mm;margin-right:1mm}
.steps{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3mm}
.step{border:1px solid var(--rule);border-top:3px solid var(--acc);padding:2.5mm 3mm;border-radius:1mm}
.step h4{margin:0 0 1mm;font-size:10pt}
.step ol{margin:0;padding-left:4.5mm}
.step li{font-size:9pt;line-height:1.38;margin:.8mm 0}
.write{margin-top:3mm;border:1px solid var(--rule);border-radius:1mm;padding:2.5mm 3mm;font-size:9.6pt}
.write b{font-size:9.4pt}
.write .lines{height:47mm;margin-top:1mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 6.4mm,#cfc8bb 6.4mm,#cfc8bb 6.7mm)}

/* ---------- Kort (mysteriet, matchning, tidslinje) ---------- */
.cards{display:grid;grid-template-columns:1fr 1fr;border-top:1px dashed #9a9387;border-left:1px dashed #9a9387}
.card{border-right:1px dashed #9a9387;border-bottom:1px dashed #9a9387;padding:3.5mm 4.5mm;display:flex;flex-direction:column;justify-content:center;position:relative}
.cards.mys .card{height:40mm}
.cards.match .card{height:31mm}
.card .tag{position:absolute;top:2.2mm;left:4.5mm;font-size:7pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.card .txt{font-size:11.3pt;line-height:1.35}
.card.big .txt{font-family:Lora,Georgia,serif;font-size:13.5pt;font-weight:700}
.card.head{background:var(--tint);color:var(--ink);text-align:center}
.card.head .txt{font-size:20pt;font-weight:800;letter-spacing:.06em}
.card.question{background:var(--tint)}
/* ledtrådskorten ser likadana ut – färgen får inte avslöja svaret */
.card.name .txt{font-family:Lora,Georgia,serif;font-size:16pt;font-weight:700;text-align:center}
.card.desc .txt{font-size:10.3pt}

.cards.time .card{height:52mm;padding:0;justify-content:flex-start}
.time .ev{flex:1;display:flex;align-items:center;padding:3mm 5mm}
.time .ev .txt{font-size:12.5pt;line-height:1.35}
.time .fold{height:14mm;border-top:1.2pt dashed var(--acc);display:flex;align-items:center;justify-content:center;
  font-family:Lora,Georgia,serif;font-size:17pt;font-weight:700;background:var(--tint);position:relative}
.time .fold:before{content:"vik bakåt";position:absolute;top:-3.2mm;right:4mm;background:#fff;padding:0 1mm;
  font:700 6.5pt Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}

/* ---------- Fyra hörn ---------- */
.corner{height:273mm;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:3mm solid var(--ink)}
.corner .num{font-family:Lora,Georgia,serif;font-size:120pt;font-weight:700;line-height:1;color:var(--acc)}
.corner .lbl{font-size:52pt;font-weight:800;line-height:1.1;margin-top:8mm;padding:0 10mm}
.corner .emo{font-size:60pt;margin-top:6mm}

/* ---------- Utgångsbiljetter ---------- */
.ticket{height:66mm;border:1px dashed #9a9387;padding:4mm 5mm;position:relative}
.ticket + .ticket{margin-top:2.2mm}
.ticket .head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5pt solid var(--ink);padding-bottom:1.5mm;margin-bottom:2mm}
.ticket .head b{font-family:Lora,Georgia,serif;font-size:14pt}
.ticket .row{display:flex;gap:4mm;font-size:9.6pt;margin:1.6mm 0;align-items:flex-end}
.ticket .row .ln{flex:1;border-bottom:.6pt solid #9a9387;height:5mm}
.ticket .lbl{font-size:9.6pt;font-weight:600;margin-top:2mm}
.ticket .lines{height:13.4mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 6.4mm,#9a9387 6.4mm,#9a9387 6.7mm)}

/* ---------- Ordlista ---------- */
.words{width:100%;border-collapse:collapse}
.words td{border-bottom:.6pt solid var(--rule);padding:1.9mm 2mm;vertical-align:top;font-size:10pt;line-height:1.38}
.words td.w{font-weight:700;width:44mm}
.words td.own{width:42mm;border-left:.6pt solid var(--rule);color:var(--mut);font-size:7.5pt}
</style>
</head>

      <tr><td class="t">5 min</td><td class="n">1. Startfrågan</td><td>"Varför ville makthavarna att alla barn skulle gå i skolan?" Tänk själv, prata i par, skriv upp gissningarna på tavlan. <b>Avslöja inte svaret</b> – det kommer i del 5.</td></tr>
      <tr><td class="t">10 min</td><td class="n">2. Rollkort + jordbrukssamhället</td><td>Dela ut rollkorten (par eller enskilt). Kort genomgång om livet i jordbrukssamhället. Statarräkningen på tavlan. Eleverna skriver i ruta <b>A</b>.</td></tr>
      <tr><td class="t">15 min</td><td class="n">3. Skiftesspelet</td><td>Grupper om fyra, en gård (A–D) per elev. Steg 1: före skiftet. Steg 2: laga skifte på det tomma rutnätet. Steg 3: vem förlorade? Eleverna skriver i ruta <b>B</b>.</td></tr>
      <tr><td class="t">10 min</td><td class="n">4. Mysteriet</td><td>Grupper om 3–4 lägger ledtrådskorten i en orsakskedja under rubrikerna Orsaker – Det som hände – Följder. Ett kort passar inte in. Eleverna skriver i ruta <b>C</b>.</td></tr>
      <tr><td class="t">10 min</td><td class="n">5. Fyra hörn</td><td>Läs ett påstående, eleverna går till ett hörn och några motiverar. Visa sedan "Så tänkte man då". Avsluta med svaret på startfrågan. Eleverna skriver i ruta <b>D</b>.</td></tr>
      <tr><td class="t">5 min</td><td class="n">6. Utgångsbiljett</td><td>"Det största som förändrades för min person var …" + ett nytt ord.</td></tr>
      <tr><td class="t">Extra</td><td class="n">Matchning · Tidslinje</td><td>Kan ersätta en del eller användas om tid blir över, eller som start nästa lektion.</td></tr>
    </tbody>
  </table>
  <h3>Förberedelser</h3>
  <ul class="tight">
    <li><b>Rollkort:</b> 8 roller, två per A4. Skriv ut 2 exemplar om klassen har fler än 8 par – samma roll kan finnas två gånger.</li>
    <li><b>Skiftesspelet:</b> ett ark per grupp om fyra. Färgpennor gör steg 2 tydligare (blå, orange, grön, lila), men bokstäverna räcker.</li>
    <li><b>Mysteriet:</b> en uppsättning per grupp, klipp ut korten (två sidor).</li>
    <li><b>Fyra hörn:</b> sätt upp skyltarna 1–4 i klassrummets hörn före lektionen.</li>
    <li><b>Utgångsbiljetter:</b> fyra per A4. <b>Ordlistan</b> kan delas ut eller ligga på bänken som stöd.</li>
  </ul>
  <div class="box"><p style="margin:0"><b>Tips för en klass som har svårt med genomgångar:</b> samma rytm hela lektionen – kort genomgång, uppgift, prata i par, ta upp i helklass. Starta timern på projektorsidan varje gång så att eleverna ser hur lång tid de har.</p></div>
`),
sheet(`
  <div class="kicker">Lärarblad · svar och stöd</div>

      <p>Folkskolan blev obligatorisk 1842. Ett av syftena var att uppfostra "den farliga underklassen" med undervisning i religion och moral, så att de fattiga inte skulle bli ett hot mot ordningen i samhället.</p>
    </div>
    <div>
      <h3>2. Statarräkningen</h3>
      <p>3 mjölkningar × 7 dagar = 21 i veckan. 21 × 52 veckor = 1 092 – alltså ungefär 1 100 mjölkningar om året, oavsett väder. Mjölkningstvånget kallades "den vita piskan". Statarsystemet avskaffades 1945.</p>

        <li><b>Efter:</b> varje gård får 14 rutor i ett stycke (byns 4 rutor och allmänningens 8 delas också). Gården flyttas ut mitt på den egna marken.</li>

      <b>Det som hände:</b> färre dog → befolkningen växte snabbt →<br>
      <b>Följder:</b> jorden räcker inte, bara äldste sonen tar över gården, få fabriksjobb → många blir fattiga → de styrande blir rädda för "den farliga underklassen" / många flyttar till städerna / många utvandrar till Amerika.</p>
      <p><b>Kortet som inte passar:</b> "Sverige var en stormakt och förde många krig" – det gäller 1600-talet. Det var tvärtom freden som gjorde att fler överlevde.</p>

        <li><b>"Fattiga ska få flytta dit de vill."</b> 1847 bestämdes att de fattiga fick röra sig fritt. De styrande hoppades att de skulle hitta arbete och försörja sig själva.</li>
        <li><b>"Det är bättre att vanliga människor hjälper de fattiga än att samhället gör det."</b> Församlingen skulle ta hand om sina fattiga, men det räckte inte. Därför startades välgörenhetsföreningar, ofta av medelklassens kvinnor.</li>
        <li><b>"Skolan finns för att göra eleverna till lydiga medborgare."</b> Folkskolan 1842 skulle bland annat uppfostra underklassen med religion och moral. Knyt an till startfrågan.</li>

/* --- Rollkort --- */
function roleCard(r){
  return `<div class="role"><span class="scissor">✂</span>
    <div class="band"><div><div class="badge">Rollkort</div><div class="name">${esc(r.name)}</div><div class="what">${esc(r.what)}</div></div>
    <div class="where">${esc(r.where)}<br><span style="font-size:8pt">Namn: ____________________</span></div></div>
    <p class="story">${esc(r.story)}</p>
    <div class="qs">${ROLE_QS.map(q=>`<div class="q"><b>${esc(q[0])}</b><span>${esc(q[1])}</span><div class="lines"></div></div>`).join('')}</div>
  </div>`;
}
section('roller','Rollkort (4 sidor)', chunk(ROLES,2).map(p=>sheet(p.map(roleCard).join(''))));

/* --- Skiftesspelet --- */
function parseVillage(){
  return VILLAGE.map(row => row.trim().split(/\s+/).map(c => ({f:c[0], q:c[1]||''})));
}
function gridHtml(empty){
  const rows = parseVillage(); let h = '<div class="grid">';
  rows.forEach(r => r.forEach((c,ci) => {
    if(empty){
      h += `<div class="cell E${c.f==='M'?' M':''}"></div>`;
    } else if(c.f==='V'){
      h += `<div class="cell V">⌂<br>byn</div>`;
    } else if(c.f==='M'){
      h += ci===3 ? `<div class="cell M" style="font-size:8pt">⌂<br>Per</div>` : `<div class="cell M">allmän-<br>ning</div>`;
    } else {
      const mark = c.q==='*' ? '★' : c.q==='~' ? '~' : '';
      h += `<div class="cell ${c.f}">${c.f}${mark?`<small>${mark}</small>`:''}</div>`;
    }
  }));
  return h + '</div>';
}
section('skifte','Skiftesspelet (1 per grupp)',[sheet(`
  <div class="kicker">Skiftesspelet · en gård per person</div>
  <h2 class="title">Från tegskifte till laga skifte</h2>
  <p style="margin:0 0 1mm">Ni är fyra bondfamiljer i samma by. Varje person är en gård: <b>A, B, C</b> eller <b>D</b>. Längst ner ligger allmänningen, där den jordlöse Per bor i en liten stuga (⌂ Per) och betar sin get.</p>
  <div class="legend">
    <span><i style="background:var(--A)"></i>Gård A</span><span><i style="background:var(--B)"></i>Gård B</span>
    <span><i style="background:var(--C)"></i>Gård C</span><span><i style="background:var(--D)"></i>Gård D</span>
    <span>★ bra jord</span><span>~ stenig eller sank jord</span><span>⌂ husen i byn</span>
  </div>
  <div class="grids">
    <div class="gridwrap"><h3>Före skiftet</h3>${gridHtml(false)}</div>
    <div class="gridwrap"><h3>Efter laga skifte</h3>${gridHtml(true)}</div>
  </div>
  <div class="steps">
    <div class="step"><h4>Steg 1 · Före</h4><ol>
      <li>Ringa in alla dina åkrar. Hur många bitar har du?</li>
      <li>Rita en väg från ditt hus i byn till din åker längst bort. Måste du gå över grannarnas åkrar?</li>
      <li>Varför har alla både ★ och ~?</li></ol></div>
    <div class="step"><h4>Steg 2 · Laga skifte</h4><ol>
      <li>Byn rivs och allmänningen delas. Nu finns 56 rutor.</li>
      <li>Dela upp marken i det tomma rutnätet: varje gård får <b>14 rutor i ett enda stycke</b>.</li>
      <li>Rita ditt nya hus mitt på din mark. Kommer ni överens?</li></ol></div>
    <div class="step"><h4>Steg 3 · Vem förlorade?</h4><ol>
      <li>Vad blev bättre för bönderna?</li>
      <li>Allmänningen finns inte längre. Var ska Per ta vägen?</li>
      <li>Vad händer med livet i byn när alla bor långt ifrån varandra?</li></ol></div>
  </div>
  <div class="write"><b>Vi kom fram till:</b> Den som vann mest på skiftet var … Den som förlorade mest var … eftersom …<div class="lines"></div></div>
`)]);

/* --- Rendera + val av delar --- */
const out = document.getElementById('out');
out.innerHTML = SECTIONS.map(s=>`<div data-sec="${s.id}">${s.sheets.join('')}</div>`).join('');
document.getElementById('picks').innerHTML = SECTIONS.map(s=>
  `<label><input type="checkbox" checked data-pick="${s.id}"> ${esc(s.label)}</label>`).join('');
document.querySelectorAll('[data-pick]').forEach(cb=>cb.addEventListener('change',()=>{
  document.querySelector(`[data-sec="${cb.dataset.pick}"]`).querySelectorAll('.sheet')
    .forEach(sh=>sh.classList.toggle('hidden',!cb.checked));
}));
/* ?bara=roller,skifte  →  visar bara de delarna */
const only = new URLSearchParams(location.search).get('bara');
if(only){ const keep = only.split(','); document.querySelectorAll('[data-pick]').forEach(cb=>{
  if(!keep.includes(cb.dataset.pick)){ cb.checked=false; cb.dispatchEvent(new Event('change')); } }); }
