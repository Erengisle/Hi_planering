<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planering</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: #F7F4EE; color: #0F1B2D;
            font-family: 'Space Grotesk', sans-serif; -webkit-font-smoothing: antialiased;
        }

        .site-header {
            padding: 16px 24px; background: #FFFFFF; border-bottom: 1px solid #DDD8D0;
        }
        .site-title {
            font-family: 'Spectral', serif; font-size: 21px; font-weight: 600; letter-spacing: -0.01em;
        }

        main {
            max-width: 760px; margin: 0 auto; padding: 48px 24px 96px;
        }
        .kicker {
            font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.16em;
            text-transform: uppercase; color: #96A3B0; margin: 0 0 12px;
        }
        h1 {
            font-family: 'Spectral', serif; font-size: 38px; line-height: 1.1; font-weight: 600;
            letter-spacing: -0.02em; margin: 0 0 14px;
        }
        .lead { font-size: 16px; line-height: 1.6; color: #556070; margin: 0; max-width: 56ch; }
    </style>
</head>
<body>
    <header class="site-header">
        <span class="site-title">Planering</span>
    </header>

    <main>
        <p class="kicker">Läsåret 2025/26</p>
        <h1>Planering</h1>
        <p class="lead">Använd länken till planeringen för din klass – den har du fått av din lärare.</p>
    </main>
</body>
</html>
